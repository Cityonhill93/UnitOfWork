name: PR Created - Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "UnitOfWork.slnx"

      - name: Build
        run: dotnet build "UnitOfWork.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "UnitOfWork.slnx" --configuration Release --no-build --verbosity normal
